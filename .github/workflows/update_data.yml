name: Bahn Monitor Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '*/45 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: bahn-monitor
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests tzdata

      - name: Main Loop
        run: |
          # Git Identität lokal setzen
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # SICHERHEITS-CHECK: Existiert die Datei überhaupt?
          if [ ! -f "fetch_all_stations.py" ]; then
            echo "❌ FEHLER: Die Datei 'fetch_all_stations.py' wurde nicht gefunden!"
            echo "Heißt deine Datei im Repository vielleicht 'main.py' oder ganz anders?"
            exit 1
          fi

          for i in {1..15}
          do
            echo "Runde $i startet..."
            
            # Skript ausführen. Wenn es hier crasht, bricht der Workflow ab!
            python fetch_all_stations.py || exit 1
            
            # Prüfen, ob JSON-Dateien generiert wurden
            ls -la *.json || echo "Keine JSON Dateien im Ordner!"
            
            git add *.json
            if ! git diff --cached --quiet; then
              git commit -m "Live Update Runde $i ($(date +'%H:%M'))"
              
              # Rebase und Push
              git pull --rebase origin main
              git push origin main
              echo "✅ Runde $i erfolgreich hochgeladen."
            else
              echo "⚠️ Keine Änderungen in Runde $i."
            fi
            
            # 150 Sekunden warten
            sleep 150
          done

      - name: Restart Workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "Bahn Monitor Loop"
