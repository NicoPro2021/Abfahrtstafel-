name: Bahn Monitor Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '*/45 * * * *'

env:
  TZ: 'Europe/Berlin'

jobs:
  run:
    # Wenn im Log "blockiert" steht (bahn.de sperrt GitHub-Server), hier auf einen eigenen Rechner/Raspberry Pi
    # mit normaler Internetleitung umstellen:  runs-on: self-hosted
    runs-on: ubuntu-latest
    concurrency:
      group: bahn-monitor
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install --upgrade pip requests curl_cffi

      # Zugangsdaten stehen NICHT mehr im Code, sondern in: Repo -> Settings -> Secrets and variables -> Actions
      - name: Prüfe Secrets
        id: check
        env:
          DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
        run: |
          if [ -z "$DB_CLIENT_ID" ] || [ -z "$DB_API_KEY" ]; then
            echo "::error::Secrets DB_CLIENT_ID und/oder DB_API_KEY fehlen (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - name: Main Loop
        env:
          DB_CLIENT_ID: ${{ secrets.DB_CLIENT_ID }}
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
          # REIHUNG_SCHAETZEN: '1'   # nur aktivieren, wenn geschätzte Reihungen (mit ~ markiert) gewünscht sind
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          for i in {1..15}
          do
            echo "=== Runde $i startet um $(date +'%H:%M:%S') ==="
            python -u fetch_all_stations.py
            
            git add *.json
            if ! git diff --cached --quiet; then
              git commit -m "Live Update Runde $i ($(date +'%H:%M'))"
              git pull --rebase --autostash origin main
              git push origin main
              echo "Runde $i erfolgreich hochgeladen."
            else
              echo "Keine Änderungen in Runde $i."
            fi
            
            sleep 150
          done

      # Nicht neu starten, wenn schon die Secrets fehlen (sonst Endlosschleife aus fehlschlagenden Läufen)
      - name: Restart Workflow
        if: always() && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run bahn_final.yml || gh workflow run "Bahn Monitor Loop"
