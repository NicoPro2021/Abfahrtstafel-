name: Bahn Monitor Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '*/45 * * * *'

env:
  TZ: 'Europe/Berlin'

jobs:
  run:
    runs-on: ubuntu-latest
    # Verhindert, dass sich Workflows überschneiden
    concurrency:
      group: bahn-monitor
      cancel-in-progress: false # Auf false, damit ein laufender Loop sauber zu Ende schreibt
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wichtig für Rebase

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install --upgrade pip requests curl_cffi

      - name: Main Loop
        run: |
          # Git Identität lokal setzen
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          for i in {1..15}
          do
            echo "=== Runde $i startet um $(date +'%H:%M:%S') ==="
            python -u fetch_all_stations.py
            
            # Prüfen, ob JSON-Dateien geändert wurden
            git add *.json
            if ! git diff --cached --quiet; then
              git commit -m "Live Update Runde $i ($(date +'%H:%M'))"
              
              # Rebase mit Autostash, falls du während des Loops Code im Repo geändert hast
              git pull --rebase --autostash origin main
              git push origin main
              echo "Runde $i erfolgreich hochgeladen."
            else
              echo "Keine Änderungen in Runde $i."
            fi
            
            # 150 Sekunden warten (entspricht ca. 40 Min Gesamtlaufzeit bei 15 Runden)
            sleep 150
          done

      - name: Restart Workflow
        if: always() # Startet den nächsten Loop auch, wenn der vorherige fehlschlug
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run bahn_final.yml || gh workflow run "Bahn Monitor Loop"
