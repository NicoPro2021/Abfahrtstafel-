name: Bahn Monitor Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '*/45 * * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: bahn-monitor
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Main Loop
        run: |
          # Git Identität lokal setzen
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          for i in {1..15}
          do
            echo "Runde $i startet..."
            python fetch_all_stations.py
            
            # Prüfen, ob JSON-Dateien geändert wurden
            git add *.json
            if ! git diff --cached --quiet; then
              git commit -m "Live Update Runde $i ($(date +'%H:%M'))"
              
              # Rebase, falls sich das Repo während des Loops geändert hat
              git pull --rebase origin main
              git push origin main
              echo "Runde $i erfolgreich hochgeladen."
            else
              echo "Keine Änderungen in Runde $i."
            fi
            
            # 150 Sekunden warten
            sleep 150
          done

      - name: Restart Workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run "Bahn Monitor Loop"
          
