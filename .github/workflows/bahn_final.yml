name: Bahn Monitor Loop

on:
  workflow_dispatch:
  schedule:
    - cron: '*/45 * * * *'

env:
  TZ: 'Europe/Berlin'

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: bahn-monitor
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install --upgrade pip requests "curl_cffi>=0.7.0" PySocks

      - name: Setup Cloudflare WARP Proxy (umgeht bahn.de HTTP 403 Sperre)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp
          sudo warp-cli --accept-tos registration new || sudo warp-cli --accept-tos register || true
          sudo warp-cli --accept-tos mode proxy
          sudo warp-cli --accept-tos proxy port 40000
          sudo warp-cli --accept-tos connect || true
          sleep 3

      - name: Main Loop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          for i in {1..15}
          do
            echo "=== Runde $i startet um $(date +'%H:%M:%S') ==="
            python -u fetch_all_stations.py
            
            git add *.json
            if ! git diff --cached --quiet; then
              git commit -m "Live Update Runde $i ($(date +'%H:%M'))"
              git pull --rebase --autostash origin main
              git push origin main
              echo "Runde $i erfolgreich hochgeladen."
            else
              echo "Keine Änderungen in Runde $i."
            fi
            
            sleep 150
          done

      - name: Restart Workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run bahn_final.yml || gh workflow run "Bahn Monitor Loop"
